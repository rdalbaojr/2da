<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2DA — Book a Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.80);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .service-btn.active {
      background: linear-gradient(to right, #2563eb, #06b6d4);
      color: white;
      border-color: transparent;
    }
  </style>
</head>
<body class="min-h-full text-slate-100 antialiased flex flex-col justify-center items-center py-10 px-4 relative bg-slate-950">

  <!-- Main Booking Container -->
  <div class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 relative z-10">
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">2DA App</h1>
        <p class="text-xs text-emerald-400 font-medium mt-1"><i class="fa-solid fa-circle-dot text-[10px] mr-1 animate-pulse"></i> 12 Drivers Available</p>
      </div>
      <div class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center border border-slate-700 cursor-pointer" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket text-slate-400 text-sm"></i>
      </div>
    </div>

    <!-- Service Selection -->
    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Select Transaction</label>
    <div class="grid grid-cols-2 gap-3 mb-6">
      <button onclick="selectService('PASSENGER')" id="btn-PASSENGER" class="service-btn active flex flex-col items-center justify-center p-4 border border-slate-800 rounded-2xl bg-slate-900/50 hover:bg-slate-800 transition-all">
        <i class="fa-solid fa-person-walking-luggage text-2xl mb-2"></i>
        <span class="text-xs font-bold">Passenger</span>
      </button>
      <button onclick="selectService('PABILI')" id="btn-PABILI" class="service-btn flex flex-col items-center justify-center p-4 border border-slate-800 rounded-2xl bg-slate-900/50 hover:bg-slate-800 transition-all text-slate-400">
        <i class="fa-solid fa-basket-shopping text-2xl mb-2"></i>
        <span class="text-xs font-bold">Pabili</span>
      </button>
      <button onclick="selectService('CARGO')" id="btn-CARGO" class="service-btn flex flex-col items-center justify-center p-4 border border-slate-800 rounded-2xl bg-slate-900/50 hover:bg-slate-800 transition-all text-slate-400">
        <i class="fa-solid fa-box-open text-2xl mb-2"></i>
        <span class="text-xs font-bold">Cargo</span>
      </button>
      <button onclick="selectService('COURIER')" id="btn-COURIER" class="service-btn flex flex-col items-center justify-center p-4 border border-slate-800 rounded-2xl bg-slate-900/50 hover:bg-slate-800 transition-all text-slate-400">
        <i class="fa-solid fa-envelope-open-text text-2xl mb-2"></i>
        <span class="text-xs font-bold">Courier</span>
      </button>
    </div>

    <!-- Routing Form -->
    <form id="booking-form" class="space-y-4">
      
      <div class="relative">
        <div class="absolute left-4 top-4 text-blue-500"><i class="fa-solid fa-location-dot"></i></div>
        <input type="text" id="pickup" required placeholder="Pick-up Location (Point A)" 
               class="w-full bg-slate-900/90 border border-slate-800 rounded-xl pl-10 pr-4 py-3.5 text-sm focus:outline-none focus:border-blue-500 transition-all">
      </div>

      <div class="relative">
        <div class="absolute left-4 top-4 text-rose-500"><i class="fa-solid fa-location-crosshairs"></i></div>
        <input type="text" id="dropoff" required placeholder="Drop-off Location (Point B)" 
               class="w-full bg-slate-900/90 border border-slate-800 rounded-xl pl-10 pr-4 py-3.5 text-sm focus:outline-none focus:border-rose-500 transition-all">
      </div>

      <!-- Hidden by default, shows only if Pabili is selected -->
      <div id="pabili-budget-container" class="hidden relative">
        <div class="absolute left-4 top-4 text-emerald-500">₱</div>
        <input type="number" id="pabili-budget" placeholder="Estimated Pabili Budget" 
               class="w-full bg-slate-900/90 border border-slate-800 rounded-xl pl-10 pr-4 py-3.5 text-sm focus:outline-none focus:border-emerald-500 transition-all">
      </div>

      <!-- Fare Estimate Display -->
      <div id="fare-estimate" class="hidden bg-slate-800/50 border border-slate-700 p-4 rounded-xl flex justify-between items-center mt-4">
        <div class="text-xs text-slate-400">Est. Total Fare</div>
        <div class="text-lg font-bold text-white" id="fare-amount">₱0.00</div>
      </div>

      <button type="submit" id="submit-btn" class="w-full mt-2 py-4 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold rounded-xl shadow-lg shadow-blue-500/25 transition-all duration-300">
        Calculate Fare <i class="fa-solid fa-calculator ml-2"></i>
      </button>

      <button type="button" id="confirm-btn" class="hidden w-full mt-2 py-4 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/25 transition-all duration-300">
        Confirm & Find Driver <i class="fa-solid fa-motorcycle ml-2"></i>
      </button>

    </form>

    <!-- Registration Prompt Message -->
    <div id="registration-prompt" class="mt-7 text-center border-t border-slate-800/60 pt-5">
      <p class="text-sm text-slate-400">
        No account yet? 
        <a href="/" class="text-blue-400 hover:text-blue-300 font-semibold transition-colors ml-1">
          Please register to proceed <i class="fa-solid fa-arrow-right-to-bracket ml-1"></i>
        </a>
      </p>
    </div>

    <!-- ==================== SEARCHING STATE (Hidden by default) ==================== -->
    <div id="searching-state" class="hidden flex flex-col items-center justify-center py-12 text-center">
      <div class="relative w-20 h-20 mb-6">
        <div class="absolute inset-0 bg-blue-500 rounded-full animate-ping opacity-75"></div>
        <div class="relative w-full h-full bg-slate-900 border-2 border-blue-500 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-motorcycle text-2xl text-blue-400"></i>
        </div>
      </div>
      <h2 class="text-xl font-extrabold text-white mb-2">Broadcasting Request...</h2>
      <p class="text-sm text-slate-400">Notifying 2DA drivers nearby.</p>
    </div>

    <!-- ==================== DRIVER FOUND STATE (Hidden by default) ==================== -->
    <div id="driver-found-state" class="hidden w-full animate-fade-in text-center">
      
      <!-- Driver Profile Card -->
      <div class="bg-slate-900/90 border border-emerald-500/30 rounded-2xl p-5 mb-5 shadow-lg shadow-emerald-500/10">
        <div class="flex items-center space-x-4">
          <div class="w-16 h-16 bg-slate-800 rounded-full border-2 border-emerald-500 flex items-center justify-center overflow-hidden">
            <i class="fa-solid fa-user-tie text-2xl text-slate-400"></i>
          </div>
          <div class="text-left">
            <h3 class="text-lg font-bold text-white">Pedro Penduko</h3>
            <p class="text-xs font-semibold text-emerald-400 uppercase tracking-wider mt-1">SAN2DA • Body #042</p>
            <div class="flex items-center text-xs text-slate-400 mt-1">
              <i class="fa-solid fa-star text-yellow-400 mr-1"></i> 4.9 (128 trips)
            </div>
          </div>
        </div>
      </div>

      <!-- Payment / QRPh Section -->
      <h4 class="text-sm font-semibold text-slate-300 mb-3">Pay via GCash / Maya (QRPh)</h4>
      <div class="bg-white p-4 rounded-2xl inline-block mb-5 border-4 border-blue-500">
        <div class="w-48 h-48 bg-slate-100 flex items-center justify-center border border-dashed border-slate-300 rounded-xl relative">
           <i class="fa-solid fa-qrcode text-6xl text-slate-300"></i>
           <p class="absolute text-xs text-slate-500 font-bold mt-20">DYNAMIC QRPH</p>
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <button class="py-3 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-xl transition-all border border-slate-700">
          <i class="fa-regular fa-comment-dots mr-2"></i> Message
        </button>
        <button class="py-3 bg-rose-600/20 hover:bg-rose-600 text-rose-500 hover:text-white border border-rose-500/30 hover:border-rose-600 text-sm font-bold rounded-xl transition-all">
          Cancel Ride
        </button>
      </div>

    </div>
  </div>

  <script>
    let currentService = 'PASSENGER';

    function selectService(service) {
      currentService = service;
      
      // Reset styles
      document.querySelectorAll('.service-btn').forEach(btn => {
        btn.classList.remove('active', 'text-white');
        btn.classList.add('text-slate-400');
      });
      
      // Set active style
      const activeBtn = document.getElementById(`btn-${service}`);
      activeBtn.classList.add('active', 'text-white');
      activeBtn.classList.remove('text-slate-400');

      // Show/Hide Pabili Budget Input
      const pabiliContainer = document.getElementById('pabili-budget-container');
      if(service === 'PABILI') {
        pabiliContainer.classList.remove('hidden');
      } else {
        pabiliContainer.classList.add('hidden');
        document.getElementById('pabili-budget').value = '';
      }

      // Reset fare calculation UI
      document.getElementById('fare-estimate').classList.add('hidden');
      document.getElementById('submit-btn').classList.remove('hidden');
      document.getElementById('confirm-btn').classList.add('hidden');
    }

    // -------------------------------------------------------------
    // HANDLE CALCULATE FARE SUBMIT
    // -------------------------------------------------------------
    document.getElementById('booking-form').addEventListener('submit', function(event) {
      event.preventDefault();
      
      document.getElementById('submit-btn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Calculating...';
      
      setTimeout(() => {
        let baseFare = 25.00;
        if(currentService === 'PABILI') baseFare = 55.00; 
        if(currentService === 'CARGO') baseFare = 70.00; 
        
        let pabiliBudget = parseFloat(document.getElementById('pabili-budget').value) || 0;
        let total = baseFare + pabiliBudget;

        document.getElementById('fare-amount').innerText = `₱${total.toFixed(2)}`;
        
        document.getElementById('fare-estimate').classList.remove('hidden');
        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('confirm-btn').classList.remove('hidden');
        document.getElementById('submit-btn').innerHTML = 'Calculate Fare <i class="fa-solid fa-calculator ml-2"></i>';
      }, 800);
    });

    // -------------------------------------------------------------
    // HANDLE CONFIRM BUTTON CLICK
    // -------------------------------------------------------------
    document.getElementById('confirm-btn').addEventListener('click', function(event) {
      event.preventDefault();

      // Hide the booking form elements and registration prompt
      document.getElementById('booking-form').classList.add('hidden');
      document.querySelector('label[class*="Select Transaction"]').classList.add('hidden');
      document.querySelector('.grid.grid-cols-2').classList.add('hidden'); 
      document.getElementById('registration-prompt').classList.add('hidden');
      
      // Show the "Searching" animation
      const searchingState = document.getElementById('searching-state');
      searchingState.classList.remove('hidden');

      // Simulate finding a driver
      setTimeout(() => {
        searchingState.classList.add('hidden');
        const driverFoundState = document.getElementById('driver-found-state');
        driverFoundState.classList.remove('hidden');
      }, 3500); 
    });

    function logout() {
      window.location.href = "/";
    }
  </script>
</body>
</html>
