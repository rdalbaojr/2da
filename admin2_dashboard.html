<!-- ==================== SECURITY & LOGIC SCRIPT ==================== -->
<script>
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    function handleMasterLogin(event) {
        event.preventDefault();
        const u = document.getElementById('masterUser').value;
        const p = document.getElementById('masterPass').value;
        
        if (u === 'masterom' && p === 'qZ822118@@') {
            document.cookie = "admin_session=masterom_active; path=/; max-age=86400";
            document.getElementById('masterLoginModal').style.display = 'none';
            applySecurityState(); 
        } else {
            alert("Invalid master credentials.");
        }
    }

    function applySecurityState() {
        const isMaster = getCookie('admin_session') === 'masterom_active';
        const inputs = document.querySelectorAll('.protected-input');
        const saveBtn = document.getElementById('saveConfigBtnContainer');
        const masterAccessBtn = document.getElementById('masterAccessContainer');
        const lockIcon = document.getElementById('lockStatusIcon');

        if (!isMaster) {
            inputs.forEach(input => {
                input.disabled = true;
                input.style.opacity = '0.6';
                input.style.cursor = 'not-allowed';
            });
            saveBtn.style.display = 'none';
            masterAccessBtn.style.display = 'flex';
            lockIcon.innerHTML = '<i class="fa-solid fa-lock" style="color: #b91c1c;"></i>';
        } else {
            inputs.forEach(input => {
                input.disabled = false;
                input.style.opacity = '1';
                input.style.cursor = 'text';
            });
            saveBtn.style.display = 'flex';
            masterAccessBtn.style.display = 'none';
            lockIcon.innerHTML = '<i class="fa-solid fa-lock-open" style="color: #15803d;"></i>';
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        if(localStorage.getItem('2da_fare_passenger')) document.getElementById('basePassenger').value = localStorage.getItem('2da_fare_passenger');
        if(localStorage.getItem('2da_fare_baggage')) document.getElementById('baseBaggage').value = localStorage.getItem('2da_fare_baggage');
        if(localStorage.getItem('2da_fare_pabili')) document.getElementById('basePabili').value = localStorage.getItem('2da_fare_pabili');
        if(localStorage.getItem('2da_fare_courier')) document.getElementById('baseCourier').value = localStorage.getItem('2da_fare_courier');
        if(localStorage.getItem('2da_platform_pct')) document.getElementById('platformShareInput').value = localStorage.getItem('2da_platform_pct');
        if(localStorage.getItem('2da_katoda_pct')) document.getElementById('katodaShareInput').value = localStorage.getItem('2da_katoda_pct');
        
        applySecurityState();
    });

    function updateFareSettings(event) {
        event.preventDefault();
        
        const fares = {
            passenger: parseFloat(document.getElementById('basePassenger').value) || 30,
            baggage: parseFloat(document.getElementById('baseBaggage').value) || 50,
            pabili: parseFloat(document.getElementById('basePabili').value) || 30,
            courier: parseFloat(document.getElementById('baseCourier').value) || 40,
            platform: parseFloat(document.getElementById('platformShareInput').value) || 17,
            katoda: parseFloat(document.getElementById('katodaShareInput').value) || 3
        };

        localStorage.setItem('2da_fare_passenger', fares.passenger);
        localStorage.setItem('2da_fare_baggage', fares.baggage);
        localStorage.setItem('2da_fare_pabili', fares.pabili);
        localStorage.setItem('2da_fare_courier', fares.courier);
        localStorage.setItem('2da_platform_pct', fares.platform);
        localStorage.setItem('2da_katoda_pct', fares.katoda);

        alert("✅ Configuration successfully saved! Live metrics across Passenger and Driver dashboards will now compute using these updated values.");
    }
</script>
